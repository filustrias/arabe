<script>
/* Aplica a fonte e o tamanho salvos antes da página aparecer, para não piscar */
try { var d = document.documentElement, f = localStorage.getItem("leitura-fonte"), a = localStorage.getItem("leitura-arabe"), t = localStorage.getItem("leitura-tamanho"); if (f) d.dataset.fonte = f; if (a) d.dataset.arabe = a; if (t) d.dataset.tamanho = t; } catch (e) {}
</script>
