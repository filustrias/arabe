<style>
.leitura { bottom: 1.2rem; position: fixed; right: 1.2rem; z-index: 1050; }
.leitura-aa { font-family: "Texto Serif", Georgia, serif; font-size: 0.95rem; padding: 0.25em 0.7em; }
.leitura-painel {
  background: var(--c-bg-elv); border: 2px solid var(--c-text); border-radius: 6px;
  bottom: 2.8rem; box-shadow: 4px 4px 0 var(--c-brand); padding: 0.8rem; position: absolute; right: 0; width: 270px;
}
.leitura-painel[hidden] { display: none; }
.leitura-painel .rotulo { color: var(--c-text-2); font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; margin: 0 0 0.35rem; text-transform: uppercase; }
.leitura-painel .opcoes { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; }
.leitura-painel .opcoes:last-child { margin-bottom: 0; }
.leitura-painel .opcoes button {
  background: transparent; border: 2px solid var(--c-border); border-radius: 4px; color: var(--c-text);
  cursor: pointer; flex: 1; font-size: 0.8rem; padding: 0.3em 0.2em;
}
.leitura-painel .opcoes button[aria-pressed="true"] { border-color: var(--c-brand); color: var(--c-brand); font-weight: 700; }
</style>
<div class="leitura">
  <button type="button" class="botao-forte leitura-aa" aria-expanded="false" aria-controls="leitura-painel" title="Fonte e tamanho do texto">Aa</button>
  <div class="leitura-painel" id="leitura-painel" hidden>
    <p class="rotulo">Fonte</p>
    <div class="opcoes" data-chave="fonte">
      <button type="button" data-valor="" style="font-family: 'Texto Sans', sans-serif">Source Sans</button>
      <button type="button" data-valor="serif" style="font-family: 'Texto Serif', serif">Literata</button>
      <button type="button" data-valor="inter" style="font-family: 'Texto Inter', sans-serif">Inter</button>
    </div>
    <p class="rotulo">Tamanho</p>
    <div class="opcoes" data-chave="tamanho">
      <button type="button" data-valor="p">A−</button>
      <button type="button" data-valor="">A</button>
      <button type="button" data-valor="g">A+</button>
    </div>
  </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var caixa = document.querySelector(".leitura");
  var botao = caixa.querySelector(".leitura-aa");
  var painel = caixa.querySelector(".leitura-painel");
  var html = document.documentElement;

  function marcar() {
    caixa.querySelectorAll(".opcoes").forEach(function (grupo) {
      var atual = html.dataset[grupo.dataset.chave] || "";
      grupo.querySelectorAll("button").forEach(function (b) {
        b.setAttribute("aria-pressed", b.dataset.valor === atual ? "true" : "false");
      });
    });
  }

  function abrir(aberto) {
    painel.hidden = !aberto;
    botao.setAttribute("aria-expanded", aberto ? "true" : "false");
  }

  botao.addEventListener("click", function () { abrir(painel.hidden); });

  caixa.querySelectorAll(".opcoes button").forEach(function (b) {
    b.addEventListener("click", function () {
      var chave = b.parentNode.dataset.chave;
      if (b.dataset.valor) html.dataset[chave] = b.dataset.valor;
      else delete html.dataset[chave];
      try {
        if (b.dataset.valor) localStorage.setItem("leitura-" + chave, b.dataset.valor);
        else localStorage.removeItem("leitura-" + chave);
      } catch (e) {}
      marcar();
    });
  });

  document.addEventListener("click", function (e) { if (!caixa.contains(e.target)) abrir(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") abrir(false); });
  marcar();
});
</script>
